<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distributed Cluster Live Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 30px;
      border-radius: 12px;
      max-width: 550px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      color: #238636;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid #238636;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    h1 { margin-bottom: 10px; font-size: 24px; }
    p { color: #8b949e; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Live & Running</div>
    <h1>Distributed Cluster Simulation</h1>
    <p>Coordinator, Merkle Tree, Consistent Hashing Ring, and Node Heartbeats are deployed and operational.</p>
  </div>
</body>
</html>
